[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/runtime",
    "crates/plugin-api",
    "crates/plugin-host",
    "crates/plugin-std",
    "crates/plugin-stub",
    "crates/app",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# No `panic = "abort"`: plugins (cdylibs built with this profile too) rely on
# `catch_unwind` in `plugin-api`'s FFI layer to keep a panicking node from taking
# down the editor.
strip = "symbols"